name: Build Keybound Brawler Helper

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet build KeyboundBrawlerHelper.csproj --configuration Release

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: KeyboundBrawlerHelper-build
          path: |
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.json
